### model
model: /nas_train/app.e0016372/train/LLaVA-OneVision-1.5-4B/v0

### method
# debug: true
megatron: true
stage: sft
tuner_type: full
freeze_vit: false
freeze_aligner: false
freeze_llm: false

### optimize
attention_backend: flash
vit_gradient_checkpointing: true
vit_gradient_checkpointing_kwargs: {"use_reentrant": false}

### dataset
cached_dataset:
  - /nas_user/app.e0016372/datasets/LLaVA-OneVision-1.5-Mid-Training-85M/cache/coyo/train
  - /nas_user/app.e0016372/datasets/LLaVA-OneVision-1.5-Mid-Training-85M/cache/datacomp1b/train
  - /nas_user/app.e0016372/datasets/LLaVA-OneVision-1.5-Mid-Training-85M/cache/imagenet/train
  - /nas_user/app.e0016372/datasets/LLaVA-OneVision-1.5-Mid-Training-85M/cache/laioncn/train
  - /nas_user/app.e0016372/datasets/LLaVA-OneVision-1.5-Mid-Training-85M/cache/mint/train
  - /nas_user/app.e0016372/datasets/LLaVA-OneVision-1.5-Mid-Training-85M/cache/obelics/train
  - /nas_user/app.e0016372/datasets/LLaVA-OneVision-1.5-Mid-Training-85M/cache/omniscience/train
  - /nas_user/app.e0016372/datasets/Open-Bee/Bee-Training-Data-Stage2/cache/train
  - /nas_user/app.e0016372/datasets/BLIP3o/BLIP3o-Pretrain-Long-Caption/cache/train
  - /nas_user/app.e0016372/datasets/BLIP3o/Mobile-O-Pre-Train/cache/train
packing: true
max_length: 8192
max_pixels: 2560000
dataloader_num_workers: 8
dataloader_persistent_workers: true
# split_dataset_ratio: 0.01
# load_from_cache_file: true

### output
output_dir: /nas_train/app.e0016372/train/LLaVA-OneVision-1.5-4B
logging_steps: 10
save_strategy: steps
save_steps: 2000
save_total_limit: 2
report_to: tensorboard

### train
micro_batch_size: 2
global_batch_size: 128
lr: 1e-5
min_lr: 1e-6
weight_decay: 0.01
num_train_epochs: 1
lr_decay_style: cosine
lr_warmup_fraction: 0.03
optimizer: adam
finetune: true
bf16: true

### parallel
sequence_parallel: false
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1

### plugins
external_plugins:
  - randy/plugins/dataset.py
