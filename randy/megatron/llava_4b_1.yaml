### model
model: /nas_train/app.e0016372/models/lmms-lab/LLaVA-OneVision-1.5-4B

### method
# debug: true
megatron: true
stage: sft
tuner_type: full
freeze_vit: true
freeze_aligner: false
freeze_llm: true

### optimize
attention_backend: flash
vit_gradient_checkpointing: false
vit_gradient_checkpointing_kwargs: {"use_reentrant": false}

### dataset
dataset: llava_pretrain_558k
packing: false
max_length: 8192
max_pixels: 2560000
dataloader_num_workers: 8
dataloader_persistent_workers: true
# split_dataset_ratio: 0.01
# load_from_cache_file: true

### output
output_dir: /nas_train/app.e0016372/train/LLaVA-OneVision-1.5-4B
logging_steps: 10
save_strategy: steps
save_steps: -1
save_total_limit: 2
report_to: tensorboard

### train
micro_batch_size: 2
global_batch_size: 256
lr: 1e-4
min_lr: 1e-6
weight_decay: 0.0
num_train_epochs: 1
lr_decay_style: cosine
lr_warmup_fraction: 0.03
optimizer: adam
finetune: true
bf16: true

### parallel
sequence_parallel: false
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1

### plugins
external_plugins:
  - randy/plugins/dataset.py
